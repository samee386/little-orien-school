<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Orien Public School and College</title>
    <style>
        :root {
            --green-dark: #073b2a;
            --green: #08794f;
            --green-light: #e1f2e9;
            --gold: #f4c542;
            --white: #ffffff;
            --text: #25352d;
            --muted: #63736a;
            --background: #f5f8f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: var(--background); color: var(--text); line-height: 1.6; }
        .topbar { background: var(--green-dark); color: white; text-align: center; padding: 8px; font-size: 13px; }
        header { background: white; padding: 15px 6%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .brand { display: flex; align-items: center; gap: 12px; }
        .logo { width: 50px; height: 50px; border-radius: 10px; background: var(--green-dark); color: var(--gold); display: grid; place-items: center; font-weight: bold; font-size: 20px; border: 2px solid var(--gold); }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        .box { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; font-weight: bold; background: var(--green); color: white; border: none; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--green-dark); }
        .btn-danger { background: #d9534f; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .hidden { display: none !important; }
        footer { background: var(--green-dark); color: white; text-align: center; padding: 20px; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="topbar">Little Orien Public School and College | Naway Kalay</div>

    <header>
        <div class="brand">
            <div class="logo">LO</div>
            <div>
                <h2>Little Orien School</h2>
                <p style="font-size: 12px; color: var(--muted);">Management Portal</p>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="loginSection" class="box" style="max-width: 400px; margin: auto; text-align: center;">
            <h3 style="margin-bottom: 20px; color: var(--green-dark);">Portal Login</h3>
            <form id="loginForm">
                <div class="form-group" style="text-align: left;">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="admin@school.com">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Login</button>
            </form>
            <p id="loginStatus" style="margin-top: 15px; font-size: 14px; color: red;"></p>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" class="box hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px;">
                <h3 id="userGreeting" style="color: var(--green-dark);">Welcome</h3>
                <button id="logoutBtn" class="btn btn-danger">Logout</button>
            </div>

            <!-- ADMIN VIEW -->
            <div id="adminView" class="hidden">
                <h4 style="margin-bottom: 15px; color: var(--green);">Admin: Create New User</h4>
                <form id="createUserForm" style="max-width: 450px;">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="newUserName" required placeholder="Ali Khan">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="newUserEmail" required placeholder="user@school.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="newUserPassword" required placeholder="Min 6 characters">
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select id="newUserRole">
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Class / Info</label>
                        <input type="text" id="newUserClass" placeholder="e.g. 10th Class">
                    </div>
                    <button type="submit" class="btn">Create Account</button>
                </form>
                <p id="adminStatus" style="margin-top: 10px; font-weight: bold;"></p>
            </div>

            <!-- TEACHER VIEW -->
            <div id="teacherView" class="hidden">
                <h4 style="margin-bottom: 15px; color: var(--green);">Teacher Dashboard: Upload Test</h4>
                <form id="uploadTestForm" style="max-width: 450px; background: var(--green-light); padding: 15px; border-radius: 8px;">
                    <div class="form-group">
                        <label>Test Title</label>
                        <input type="text" id="testTitle" required placeholder="Maths Quiz">
                    </div>
                    <div class="form-group">
                        <label>Class</label>
                        <input type="text" id="testClass" required placeholder="10th">
                    </div>
                    <div class="form-group">
                        <label>Details / Link</label>
                        <input type="text" id="testDetails" required placeholder="Details...">
                    </div>
                    <button type="submit" class="btn">Upload Test</button>
                </form>
                <p id="teacherStatusMsg" style="margin-top: 10px; font-weight: bold;"></p>
            </div>

            <!-- STUDENT VIEW -->
            <div id="studentView" class="hidden">
                <h4 style="margin-bottom: 15px; color: var(--green);">Student Portal</h4>
                <div id="studentDataCard" style="padding: 15px; background: var(--green-light); border-radius: 8px;">
                    Loading data...
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; Little Orien Public School and College, Naway Kalay</p>
    </footer>

    <!-- FIREBASE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoOtmxvdFOyo2e-NmdNMDeSv9smiPbrTM",
            authDomain: "little-orien-school.firebaseapp.com",
            projectId: "little-orien-school",
            storageBucket: "little-orien-school.firebasestorage.app",
            messagingSenderId: "920778107064",
            appId: "1:920778107064:web:a50ee9d38e79bae6adec4d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const loginSection = document.getElementById("loginSection");
        const dashboardSection = document.getElementById("dashboardSection");
        const loginForm = document.getElementById("loginForm");
        const loginStatus = document.getElementById("loginStatus");
        const userGreeting = document.getElementById("userGreeting");
        const logoutBtn = document.getElementById("logoutBtn");

        const adminView = document.getElementById("adminView");
        const teacherView = document.getElementById("teacherView");
        const studentView = document.getElementById("studentView");

        // Login Logic
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
            loginStatus.style.color = "black";
            loginStatus.textContent = "Logging in...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginStatus.textContent = "";
            } catch (error) {
                loginStatus.style.color = "red";
                loginStatus.textContent = "Error: " + error.message;
            }
        });

        logoutBtn.addEventListener("click", () => {
            signOut(auth);
        });

        // Auth State Handler
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                loginSection.classList.add("hidden");
                dashboardSection.classList.remove("hidden");

                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        userGreeting.textContent = `Welcome, ${userData.name} (${userData.role.toUpperCase()})`;

                        adminView.classList.add("hidden");
                        teacherView.classList.add("hidden");
                        studentView.classList.add("hidden");

                        if (userData.role === "admin") {
                            adminView.classList.remove("hidden");
                        } else if (userData.role === "teacher") {
                            teacherView.classList.remove("hidden");
                        } else if (userData.role === "student") {
                            studentView.classList.remove("hidden");
                            loadStudentData(userData);
                        }
                    } else {
                        userGreeting.textContent = `Welcome, ${user.email} (Role not assigned)`;
                    }
                } catch (err) {
                    console.error(err);
                }
            } else {
                loginSection.classList.remove("hidden");
                dashboardSection.classList.add("hidden");
            }
        });

        // Admin Create User
        const createUserForm = document.getElementById("createUserForm");
        const adminStatus = document.getElementById("adminStatus");

        createUserForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("newUserName").value;
            const email = document.getElementById("newUserEmail").value;
            const password = document.getElementById("newUserPassword").value;
            const role = document.getElementById("newUserRole").value;
            const classInfo = document.getElementById("newUserClass").value;

            adminStatus.style.color = "black";
            adminStatus.textContent = "Creating...";

            try {
                const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp" + Math.random());
                const secondaryAuth = getAuth(secondaryApp);
                const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
                
                await setDoc(doc(db, "users", cred.user.uid), {
                    name: name,
                    email: email,
                    role: role,
                    class: classInfo
                });

                adminStatus.style.color = "green";
                adminStatus.textContent = `Account created for ${name}!`;
                createUserForm.reset();
            } catch (err) {
                adminStatus.style.color = "red";
                adminStatus.textContent = "Error: " + err.message;
            }
        });

        // Teacher Upload Test
        const uploadTestForm = document.getElementById("uploadTestForm");
        const teacherStatusMsg = document.getElementById("teacherStatusMsg");

        uploadTestForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("testTitle").value;
            const tClass = document.getElementById("testClass").value;
            const details = document.getElementById("testDetails").value;

            teacherStatusMsg.style.color = "black";
            teacherStatusMsg.textContent = "Uploading...";

            try {
                await setDoc(doc(collection(db, "Tests")), {
                    title: title,
                    class: tClass,
                    details: details,
                    date: new Date().toLocaleDateString()
                });
                teacherStatusMsg.style.color = "green";
                teacherStatusMsg.textContent = "Test uploaded successfully!";
                uploadTestForm.reset();
            } catch (err) {
                teacherStatusMsg.style.color = "red";
                teacherStatusMsg.textContent = "Failed to upload.";
            }
        });

        // Student Data Loader
        async function loadStudentData(userData) {
            const card = document.getElementById("studentDataCard");
            card.innerHTML = `<p><strong>Name:</strong> ${userData.name}</p><p><strong>Class:</strong> ${userData.class || 'N/A'}</p><hr style="margin: 10px 0;"><strong>Uploaded Tests:</strong>`;
            
            try {
                const snap = await getDocs(collection(db, "Tests"));
                if (snap.empty) {
                    card.innerHTML += `<p style="color: gray;">No tests found.</p>`;
                    return;
                }
                snap.forEach((d) => {
                    const data = d.data();
                    card.innerHTML += `<div style="background: white; padding: 8px; margin-top: 5px; border-radius: 5px;"><strong>${data.title}</strong> (Class: ${data.class})<br>${data.details}</div>`;
                });
            } catch (e) {
                card.innerHTML += `<p>Could not load tests.</p>`;
            }
        }
    </script>
</body>
</html>
